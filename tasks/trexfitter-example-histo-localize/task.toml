schema_version = "1.3"
artifacts = []

[task]
name = "lbl/trexfitter-example-histo-localize"
description = "Localize the official TRExFitter histogram example from EOS paths to a mounted input mirror, then validate the h/w/f workflow in the StatAnalysis image."
authors = []
keywords = ["trexfitter", "atlas", "statanalysis", "histograms", "harbor"]

[metadata]
category = "scientific-config"

[verifier]
timeout_sec = 240.0

[[verifier.collect]]
service = "main"
timeout_sec = 210.0
command = """bash -lc 'set -e
mkdir -p /logs/artifacts

for gcc_setup in /opt/lcg/gcc/13.1.0*/x86_64-*/setup.sh /opt/lcg/gcc/14.2.0*/x86_64-*/setup.sh; do
  if [ -f "$gcc_setup" ]; then
    . "$gcc_setup"
    break
  fi
done

for stat_setup in /usr/StatAnalysis/*/InstallArea/*/setup.sh; do
  if [ -f "$stat_setup" ]; then
    . "$stat_setup"
    break
  fi
done

if [ ! -f /tmp/FitExample.local.config ]; then
  printf "missing /tmp/FitExample.local.config\\n" > /logs/artifacts/trexfitter_h.log
  printf "working config was not created\\n" > /logs/artifacts/trexfitter_w.log
  printf "working config was not created\\n" > /logs/artifacts/trexfitter_f.log
  printf "125\\n" > /logs/artifacts/trexfitter_h.exitcode
  printf "125\\n" > /logs/artifacts/trexfitter_w.exitcode
  printf "125\\n" > /logs/artifacts/trexfitter_f.exitcode
  exit 0
fi

cd /tmp
set +e
trex-fitter h /tmp/FitExample.local.config > /logs/artifacts/trexfitter_h.log 2>&1
hrc=$?
if [ "$hrc" -eq 0 ]; then
  trex-fitter w /tmp/FitExample.local.config > /logs/artifacts/trexfitter_w.log 2>&1
  wrc=$?
else
  printf "histogram step failed, skipping workspace\\n" > /logs/artifacts/trexfitter_w.log
  wrc=125
fi
if [ "$wrc" -eq 0 ]; then
  trex-fitter f /tmp/FitExample.local.config > /logs/artifacts/trexfitter_f.log 2>&1
  frc=$?
else
  printf "workspace step failed, skipping fit\\n" > /logs/artifacts/trexfitter_f.log
  frc=125
fi
set -e

printf "%s\\n" "$hrc" > /logs/artifacts/trexfitter_h.exitcode
printf "%s\\n" "$wrc" > /logs/artifacts/trexfitter_w.exitcode
printf "%s\\n" "$frc" > /logs/artifacts/trexfitter_f.exitcode
find /tmp/FitExample -maxdepth 4 -type f | sort > /logs/artifacts/trexfitter_outputs.txt 2>/dev/null || true
cp /tmp/FitExample.local.config /logs/artifacts/FitExample.local.config

if [ -f /tmp/FitExample/Histograms/FitExample_histos.root ]; then
  cp /tmp/FitExample/Histograms/FitExample_histos.root /logs/artifacts/FitExample_histos.root
fi
if [ -f /tmp/FitExample/RooStats/FitExample_combined_FitExample_model.root ]; then
  cp /tmp/FitExample/RooStats/FitExample_combined_FitExample_model.root /logs/artifacts/FitExample_combined_FitExample_model.root
fi
if [ -f /tmp/FitExample/Fits/FitExample.root ]; then
  cp /tmp/FitExample/Fits/FitExample.root /logs/artifacts/FitExample_fit_results.root
fi
if [ -f /tmp/FitExample/Fits/FitExample.txt ]; then
  cp /tmp/FitExample/Fits/FitExample.txt /logs/artifacts/FitExample_fit_summary.txt
fi
exit 0'"""

[verifier.env]

[agent]
timeout_sec = 300.0

[environment]
network_mode = "public"
build_timeout_sec = 600.0
os = "linux"
mcp_servers = []

[environment.env]

[solution.env]
