schema_version = "1.3"
artifacts = []

[task]
name = "lbl/trexfitter-morphing-width-fit"
description = "Localize and run the official TRExFitter morphing example for the topWidth parameter."
authors = []
keywords = ["trexfitter", "atlas", "morphing", "top-width", "fit"]

[metadata]
category = "scientific-config"

[verifier]
timeout_sec = 300.0

[[verifier.collect]]
service = "main"
timeout_sec = 240.0
command = """bash -lc 'set -e
mkdir -p /logs/artifacts

for gcc_setup in /opt/lcg/gcc/13.1.0*/x86_64-*/setup.sh /opt/lcg/gcc/14.2.0*/x86_64-*/setup.sh; do
  if [ -f "$gcc_setup" ]; then
    . "$gcc_setup"
    break
  fi
done

for stat_setup in /usr/StatAnalysis/*/InstallArea/*/setup.sh; do
  if [ -f "$stat_setup" ]; then
    . "$stat_setup"
    break
  fi
done

if [ ! -f /tmp/FitExampleMorphing.local.config ]; then
  for step in h w f; do
    printf "missing /tmp/FitExampleMorphing.local.config\\n" > "/logs/artifacts/trexfitter_${step}.log"
    printf "125\\n" > "/logs/artifacts/trexfitter_${step}.exitcode"
  done
  exit 0
fi

cd /tmp
set +e
for step in h w f; do
  trex-fitter "$step" /tmp/FitExampleMorphing.local.config > "/logs/artifacts/trexfitter_${step}.log" 2>&1
  rc=$?
  printf "%s\\n" "$rc" > "/logs/artifacts/trexfitter_${step}.exitcode"
  if [ "$rc" -ne 0 ]; then
    break
  fi
done
set -e

find /tmp/FitExampleMorphing -maxdepth 4 -type f | sort > /logs/artifacts/trexfitter_outputs.txt 2>/dev/null || true
cp /tmp/FitExampleMorphing.local.config /logs/artifacts/FitExampleMorphing.local.config

for f in \
  /tmp/FitExampleMorphing/Histograms/FitExampleMorphing_histos.root \
  /tmp/FitExampleMorphing/RooStats/FitExampleMorphing_combined_FitExampleMorphing_model.root \
  /tmp/FitExampleMorphing/Fits/FitExampleMorphing.root \
  /tmp/FitExampleMorphing/Fits/FitExampleMorphing.txt \
  /tmp/FitExampleMorphing/Fits/FitExampleMorphing_errDecomp_topWidth.txt; do
  if [ -f "$f" ]; then
    cp "$f" "/logs/artifacts/$(basename "$f")"
  fi
done
exit 0'"""

[verifier.env]

[agent]
timeout_sec = 300.0

[environment]
network_mode = "public"
build_timeout_sec = 600.0
os = "linux"
mcp_servers = []

[environment.env]

[solution.env]
