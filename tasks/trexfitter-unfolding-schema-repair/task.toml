schema_version = "1.3"
artifacts = []

[task]
name = "lbl/trexfitter-unfolding-schema-repair"
description = "Localize and repair the official TRExFitter unfolding example for the pinned StatAnalysis schema, then run u/h/w/f."
authors = []
keywords = ["trexfitter", "atlas", "unfolding", "schema-repair", "fit"]

[metadata]
category = "scientific-config"

[verifier]
timeout_sec = 420.0

[[verifier.collect]]
service = "main"
timeout_sec = 360.0
command = """bash -lc 'set -e
mkdir -p /logs/artifacts

for gcc_setup in /opt/lcg/gcc/13.1.0*/x86_64-*/setup.sh /opt/lcg/gcc/14.2.0*/x86_64-*/setup.sh; do
  if [ -f "$gcc_setup" ]; then
    . "$gcc_setup"
    break
  fi
done

for stat_setup in /usr/StatAnalysis/*/InstallArea/*/setup.sh; do
  if [ -f "$stat_setup" ]; then
    . "$stat_setup"
    break
  fi
done

if [ ! -f /tmp/FitExampleUnfolding.local.config ]; then
  for step in u h w f; do
    printf "missing /tmp/FitExampleUnfolding.local.config\\n" > "/logs/artifacts/trexfitter_${step}.log"
    printf "125\\n" > "/logs/artifacts/trexfitter_${step}.exitcode"
  done
  exit 0
fi

cd /tmp
set +e
for step in u h w f; do
  trex-fitter "$step" /tmp/FitExampleUnfolding.local.config > "/logs/artifacts/trexfitter_${step}.log" 2>&1
  rc=$?
  printf "%s\\n" "$rc" > "/logs/artifacts/trexfitter_${step}.exitcode"
  if [ "$rc" -ne 0 ]; then
    break
  fi
done
set -e

find /tmp/FitExampleUnfolding -maxdepth 4 -type f | sort > /logs/artifacts/trexfitter_outputs.txt 2>/dev/null || true
cp /tmp/FitExampleUnfolding.local.config /logs/artifacts/FitExampleUnfolding.local.config

for f in \
  /tmp/FitExampleUnfolding/Histograms/FitExampleUnfolding_histos.root \
  /tmp/FitExampleUnfolding/Histograms/Binnings/SR1.txt \
  /tmp/FitExampleUnfolding/RooStats/FitExampleUnfolding_combined_FitExampleUnfolding_model.root \
  /tmp/FitExampleUnfolding/RooStats/FitExampleUnfolding_combined_FitExampleUnfolding_withRegularisation.root \
  /tmp/FitExampleUnfolding/Fits/FitExampleUnfolding.root \
  /tmp/FitExampleUnfolding/Fits/FitExampleUnfolding.txt \
  /tmp/FitExampleUnfolding/Fits/Unfolding_UnfoldedResults.txt; do
  if [ -f "$f" ]; then
    cp "$f" "/logs/artifacts/$(basename "$f")"
  fi
done
exit 0'"""

[verifier.env]

[agent]
timeout_sec = 300.0

[environment]
network_mode = "public"
build_timeout_sec = 600.0
os = "linux"
mcp_servers = []

[environment.env]

[solution.env]
