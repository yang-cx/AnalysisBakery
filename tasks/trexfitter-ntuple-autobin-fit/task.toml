schema_version = "1.3"
artifacts = []

[task]
name = "lbl/trexfitter-ntuple-autobin-fit"
description = "Localize and run the official TRExFitter ntuple example, including ntuple reading, auto-binning, workspace creation, and fit validation."
authors = []
keywords = ["trexfitter", "atlas", "ntuple", "autobin", "fit"]

[metadata]
category = "scientific-config"

[verifier]
timeout_sec = 420.0

[[verifier.collect]]
service = "main"
timeout_sec = 360.0
command = """bash -lc 'set -e
mkdir -p /logs/artifacts

for gcc_setup in /opt/lcg/gcc/13.1.0*/x86_64-*/setup.sh /opt/lcg/gcc/14.2.0*/x86_64-*/setup.sh; do
  if [ -f "$gcc_setup" ]; then
    . "$gcc_setup"
    break
  fi
done

for stat_setup in /usr/StatAnalysis/*/InstallArea/*/setup.sh; do
  if [ -f "$stat_setup" ]; then
    . "$stat_setup"
    break
  fi
done

if [ ! -f /tmp/FitExampleNtuple.local.config ]; then
  for step in n b w f; do
    printf "missing /tmp/FitExampleNtuple.local.config\\n" > "/logs/artifacts/trexfitter_${step}.log"
    printf "125\\n" > "/logs/artifacts/trexfitter_${step}.exitcode"
  done
  exit 0
fi

cd /tmp
set +e
for step in n b w f; do
  trex-fitter "$step" /tmp/FitExampleNtuple.local.config > "/logs/artifacts/trexfitter_${step}.log" 2>&1
  rc=$?
  printf "%s\\n" "$rc" > "/logs/artifacts/trexfitter_${step}.exitcode"
  if [ "$rc" -ne 0 ]; then
    break
  fi
done
set -e

find /tmp/FitExampleNtuple -maxdepth 4 -type f | sort > /logs/artifacts/trexfitter_outputs.txt 2>/dev/null || true
cp /tmp/FitExampleNtuple.local.config /logs/artifacts/FitExampleNtuple.local.config

for f in \
  /tmp/FitExampleNtuple/Histograms/FitExampleNtuple_ljets_5j3b_HT_histos.root \
  /tmp/FitExampleNtuple/Histograms/FitExampleNtuple_ljets_6j4b_BDT_histos.root \
  /tmp/FitExampleNtuple/Histograms/Binnings/ljets_5j3b_HT.txt \
  /tmp/FitExampleNtuple/Histograms/Binnings/ljets_6j4b_BDT.txt \
  /tmp/FitExampleNtuple/RooStats/FitExampleNtuple_combined_FitExampleNtuple_model.root \
  /tmp/FitExampleNtuple/RooStats/FitExampleNtuple_realisticAsimov.root \
  /tmp/FitExampleNtuple/Fits/FitExampleNtuple.root \
  /tmp/FitExampleNtuple/Fits/FitExampleNtuple.txt; do
  if [ -f "$f" ]; then
    cp "$f" "/logs/artifacts/$(basename "$f")"
  fi
done
exit 0'"""

[verifier.env]

[agent]
timeout_sec = 300.0

[environment]
network_mode = "public"
build_timeout_sec = 600.0
os = "linux"
mcp_servers = []

[environment.env]

[solution.env]
